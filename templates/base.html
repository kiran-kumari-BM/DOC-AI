<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>DOC AI</title>

    <meta name="theme-color" content="#0b1020">

    <style>

        /* =====================================================
           DOC AI — GLOBAL DESIGN SYSTEM
        ===================================================== */

        :root {

            --bg: #f6f8fc;

            --navy: #0b1020;
            --navy-light: #111936;

            --blue: #2563eb;
            --blue-light: #60a5fa;

            --purple: #7c3aed;

            --text: #111827;
            --muted: #64748b;

            --white: #ffffff;

            --border: rgba(148, 163, 184, 0.22);

            --shadow:
                0 20px 60px rgba(15, 23, 42, 0.12);

            --radius: 22px;

        }


        /* =====================================================
           RESET
        ===================================================== */

        * {

            box-sizing: border-box;

            margin: 0;

            padding: 0;

        }


        html {

            scroll-behavior: smooth;

        }


        body {

            min-height: 100vh;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                "Segoe UI",
                sans-serif;

            color: var(--text);

            background: var(--bg);

        }


        button,
        input {

            font-family: inherit;

        }


        a {

            text-decoration: none;

        }


        /* =====================================================
           DOC AI SPLASH
        ===================================================== */

        #docAiSplash {

            position: fixed;

            inset: 0;

            width: 100vw;

            height: 100vh;

            background:

                radial-gradient(
                    circle at 50% 45%,
                    rgba(59, 130, 246, 0.12),
                    transparent 30%
                ),

                #ffffff;

            display: flex;

            justify-content: center;

            align-items: center;

            z-index: 999999;

            opacity: 1;

            visibility: visible;

            transition:

                opacity 0.9s ease,

                visibility 0.9s ease;

        }


        #docAiSplash.hide {

            opacity: 0;

            visibility: hidden;

            pointer-events: none;

        }


        .doc-ai-splash-content {

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            animation:

                docAiEntrance
                1.5s
                cubic-bezier(.16,1,.3,1)
                forwards;

        }


        .doc-ai-splash-logo {

            width: 420px;

            max-width: 78vw;

            height: auto;

            display: block;

            object-fit: contain;

            animation:

                docAiGlow
                2.2s
                ease-in-out
                infinite;

        }


        /* =====================================================
           SPLASH LOADER
        ===================================================== */

        .doc-ai-loader {

            display: flex;

            gap: 8px;

            margin-top: 12px;

        }


        .doc-ai-loader span {

            width: 7px;

            height: 7px;

            border-radius: 50%;

            background: var(--blue);

            animation:

                docAiLoader
                1.2s
                ease-in-out
                infinite;

        }


        .doc-ai-loader span:nth-child(2) {

            animation-delay: .15s;

        }


        .doc-ai-loader span:nth-child(3) {

            animation-delay: .3s;

        }


        /* =====================================================
           SPLASH ANIMATIONS
        ===================================================== */

        @keyframes docAiEntrance {

            0% {

                opacity: 0;

                transform:

                    scale(.55)

                    translateY(35px);

            }

            55% {

                opacity: 1;

                transform:

                    scale(1.08)

                    translateY(0);

            }

            75% {

                transform: scale(.97);

            }

            100% {

                opacity: 1;

                transform: scale(1);

            }

        }


        @keyframes docAiGlow {

            0%,
            100% {

                filter:

                    drop-shadow(
                        0 15px 35px
                        rgba(37,99,235,.16)
                    );

            }

            50% {

                filter:

                    drop-shadow(
                        0 25px 65px
                        rgba(79,70,229,.35)
                    );

            }

        }


        @keyframes docAiLoader {

            0%,
            80%,
            100% {

                transform: scale(.6);

                opacity: .35;

            }

            40% {

                transform: scale(1.25);

                opacity: 1;

            }

        }


        /* =====================================================
           PAGE CONTENT
        ===================================================== */

        .page-content {

            min-height: 100vh;

        }


        /* =====================================================
           AUTHENTICATION BACKGROUND
        ===================================================== */

        .auth-page {

            position: relative;

            min-height: 100vh;

            overflow: hidden;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 40px 20px;

            background:

                radial-gradient(
                    circle at 10% 20%,
                    rgba(37,99,235,.15),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 90% 80%,
                    rgba(124,58,237,.14),
                    transparent 30%
                ),

                #f7f9fd;

        }


        /* =====================================================
           BACKGROUND BLOBS
        ===================================================== */

        .auth-orb {

            position: absolute;

            border-radius: 50%;

            filter: blur(2px);

            pointer-events: none;

        }


        .auth-orb-one {

            width: 420px;

            height: 420px;

            background:

                radial-gradient(
                    circle,
                    rgba(37,99,235,.12),
                    transparent 70%
                );

            top: -160px;

            left: -120px;

            animation:

                floatingOrb
                8s
                ease-in-out
                infinite;

        }


        .auth-orb-two {

            width: 500px;

            height: 500px;

            background:

                radial-gradient(
                    circle,
                    rgba(124,58,237,.12),
                    transparent 70%
                );

            bottom: -220px;

            right: -160px;

            animation:

                floatingOrb
                10s
                ease-in-out
                infinite reverse;

        }


        @keyframes floatingOrb {

            0%,
            100% {

                transform: translate(0,0);

            }

            50% {

                transform: translate(25px,-20px);

            }

        }


        /* =====================================================
           AUTH LAYOUT
        ===================================================== */

        .auth-container {

            position: relative;

            z-index: 2;

            width: 100%;

            max-width: 1050px;

            display: grid;

            grid-template-columns: 1fr 440px;

            gap: 70px;

            align-items: center;

        }


        /* =====================================================
           AUTH BRAND PANEL
        ===================================================== */

        .auth-brand {

            padding: 20px;

        }


        .auth-brand-badge {

            display: inline-flex;

            align-items: center;

            gap: 8px;

            padding: 8px 14px;

            border-radius: 999px;

            background: rgba(37,99,235,.08);

            border: 1px solid rgba(37,99,235,.12);

            color: var(--blue);

            font-size: 13px;

            font-weight: 700;

            letter-spacing: .04em;

            margin-bottom: 22px;

        }


        .auth-brand-badge-dot {

            width: 7px;

            height: 7px;

            border-radius: 50%;

            background: var(--blue);

            box-shadow:

                0 0 0 5px rgba(37,99,235,.1);

        }


        .auth-brand h1 {

            font-size:

                clamp(42px, 5vw, 68px);

            line-height: .98;

            letter-spacing: -.055em;

            color: var(--navy);

            margin-bottom: 24px;

        }


        .auth-brand h1 span {

            background:

                linear-gradient(
                    135deg,
                    #2563eb,
                    #7c3aed
                );

            -webkit-background-clip: text;

            background-clip: text;

            color: transparent;

        }


        .auth-brand-description {

            max-width: 560px;

            color: var(--muted);

            font-size: 18px;

            line-height: 1.7;

            margin-bottom: 32px;

        }


        /* =====================================================
           FEATURE PILLS
        ===================================================== */

        .auth-features {

            display: flex;

            flex-wrap: wrap;

            gap: 10px;

        }


        .auth-feature {

            padding: 9px 13px;

            border-radius: 10px;

            background: rgba(255,255,255,.72);

            border: 1px solid var(--border);

            color: #475569;

            font-size: 13px;

            font-weight: 600;

            backdrop-filter: blur(10px);

        }


        /* =====================================================
           AUTH CARD
        ===================================================== */

        .auth-card {

            position: relative;

            width: 100%;

            padding: 38px;

            background:

                rgba(255,255,255,.88);

            border:

                1px solid
                rgba(255,255,255,.9);

            border-radius:

                var(--radius);

            box-shadow:

                0 30px 80px
                rgba(15,23,42,.14);

            backdrop-filter:

                blur(20px);

            -webkit-backdrop-filter:

                blur(20px);

            animation:

                authCardEntrance
                .8s
                cubic-bezier(.16,1,.3,1);

        }


        @keyframes authCardEntrance {

            from {

                opacity: 0;

                transform:

                    translateY(25px)
                    scale(.97);

            }

            to {

                opacity: 1;

                transform:

                    translateY(0)
                    scale(1);

            }

        }


        /* =====================================================
           AUTH LOGO
        ===================================================== */

        .auth-logo {

            width: 100px;

            height: auto;

            display: block;

            margin-bottom: 22px;

        }


        .auth-card h2 {

            font-size: 30px;

            letter-spacing: -.035em;

            color: var(--navy);

            margin-bottom: 8px;

        }


        .auth-subtitle {

            color: var(--muted);

            font-size: 14px;

            line-height: 1.6;

            margin-bottom: 28px;

        }


        /* =====================================================
           FORM
        ===================================================== */

        .auth-form {

            display: flex;

            flex-direction: column;

            gap: 17px;

        }


        .auth-field {

            display: flex;

            flex-direction: column;

            gap: 7px;

        }


        .auth-field label {

            font-size: 13px;

            font-weight: 700;

            color: #334155;

        }


        .auth-input {

            width: 100%;

            height: 50px;

            border-radius: 12px;

            border:

                1px solid
                #dbe2ea;

            background: #f8fafc;

            padding: 0 15px;

            font-size: 14px;

            color: var(--text);

            outline: none;

            transition:

                border-color .2s ease,

                box-shadow .2s ease,

                background .2s ease;

        }


        .auth-input::placeholder {

            color: #94a3b8;

        }


        .auth-input:focus {

            background: #ffffff;

            border-color: var(--blue);

            box-shadow:

                0 0 0 4px
                rgba(37,99,235,.10);

        }


        /* =====================================================
           AUTH BUTTON
        ===================================================== */

        .auth-button {

            width: 100%;

            height: 51px;

            border: 0;

            border-radius: 12px;

            background:

                linear-gradient(
                    135deg,
                    #2563eb,
                    #4f46e5
                );

            color: white;

            font-size: 14px;

            font-weight: 750;

            cursor: pointer;

            box-shadow:

                0 12px 25px
                rgba(37,99,235,.24);

            transition:

                transform .2s ease,

                box-shadow .2s ease;

        }


        .auth-button:hover {

            transform:

                translateY(-2px);

            box-shadow:

                0 16px 32px
                rgba(37,99,235,.30);

        }


        .auth-button:active {

            transform:

                translateY(0);

        }


        /* =====================================================
           AUTH FOOTER
        ===================================================== */

        .auth-switch {

            text-align: center;

            margin-top: 23px;

            color: var(--muted);

            font-size: 13px;

        }


        .auth-switch a {

            color: var(--blue);

            font-weight: 750;

        }


        .auth-switch a:hover {

            text-decoration: underline;

        }


        /* =====================================================
           FLASH MESSAGE
        ===================================================== */

        .auth-alert {

            margin-bottom: 20px;

            padding: 12px 14px;

            border-radius: 11px;

            background: #eff6ff;

            border: 1px solid #dbeafe;

            color: #1d4ed8;

            font-size: 13px;

        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 850px) {

            .auth-container {

                grid-template-columns: 1fr;

                max-width: 500px;

                gap: 20px;

            }

            .auth-brand {

                text-align: center;

                padding: 0;

            }

            .auth-brand-description {

                margin-left: auto;

                margin-right: auto;

            }

            .auth-features {

                justify-content: center;

            }

            .auth-brand h1 {

                font-size: 44px;

            }

        }


        @media (max-width: 500px) {

            .auth-page {

                padding: 25px 15px;

            }

            .auth-card {

                padding: 28px 22px;

                border-radius: 18px;

            }

            .auth-brand {

                display: none;

            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         DOC AI SPLASH
    ====================================================== -->

    {% if request.endpoint in ['auth.login', 'auth.register'] %}

    <div id="docAiSplash">

        <div class="doc-ai-splash-content">

            <img
                src="{{ url_for(
                    'static',
                    filename='images/doc-ai-logo.png'
                ) }}"
                alt="DOC AI"
                class="doc-ai-splash-logo"
            >

            <div class="doc-ai-loader">

                <span></span>
                <span></span>
                <span></span>

            </div>

        </div>

    </div>

    {% endif %}


    <!-- =====================================================
         PAGE CONTENT
    ====================================================== -->

    <main class="page-content">

        {% block content %}
        {% endblock %}

    </main>


    <!-- =====================================================
         DOC AI SPLASH SCRIPT
    ====================================================== -->

    {% if request.endpoint in ['auth.login', 'auth.register'] %}

    <script>

        window.addEventListener(
            "load",
            function () {

                const splash =
                    document.getElementById(
                        "docAiSplash"
                    );

                if (!splash) {
                    return;
                }

                setTimeout(
                    function () {

                        splash.classList.add(
                            "hide"
                        );

                    },
                    2800
                );

            }
        );

    </script>

    {% endif %}


</body>

</html>
