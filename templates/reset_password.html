<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reset Password - DOC AI</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            font-family: Arial, sans-serif;

            background: #f4f7fb;
        }

        .container {

            width: 420px;

            max-width: 90%;

            background: white;

            padding: 40px;

            border-radius: 12px;

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.10);
        }

        h1 {

            text-align: center;

            margin-bottom: 10px;
        }

        .subtitle {

            text-align: center;

            color: #666;

            margin-bottom: 30px;
        }

        label {

            display: block;

            margin-bottom: 8px;

            font-weight: bold;
        }

        .field {

            margin-bottom: 18px;
        }

        input {

            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 7px;

            font-size: 15px;
        }

        input:focus {

            outline: none;

            border-color: #4f46e5;
        }

        button {

            width: 100%;

            padding: 12px;

            margin-top: 5px;

            border: none;

            border-radius: 7px;

            background: #4f46e5;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {

            background: #4338ca;
        }

        .password-info {

            font-size: 13px;

            color: #777;

            margin-top: 5px;
        }

        .alert {

            padding: 10px;

            margin-bottom: 15px;

            border-radius: 6px;

            background: #f8d7da;

            color: #842029;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Reset Password</h1>

    <p class="subtitle">

        Create a new password for your DOC AI account.

    </p>

    {% with messages = get_flashed_messages(with_categories=true) %}

        {% if messages %}

            {% for category, message in messages %}

                <div class="alert">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}

    <form method="POST">

        <div class="field">

            <label for="password">
                New Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                minlength="8"
                placeholder="Enter new password"
                required
            >

            <div class="password-info">
                Password must contain at least 8 characters.
            </div>

        </div>


        <div class="field">

            <label for="confirm_password">
                Confirm New Password
            </label>

            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                minlength="8"
                placeholder="Confirm new password"
                required
            >

        </div>


        <button type="submit">
            Change Password
        </button>

    </form>

</div>

</body>
</html>
