<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Verify OTP - DOC AI</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            font-family: Arial, sans-serif;

            background: #f4f7fb;
        }

        .container {

            width: 420px;

            max-width: 90%;

            background: white;

            padding: 40px;

            border-radius: 12px;

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.10);
        }

        h1 {

            text-align: center;

            margin-bottom: 10px;
        }

        .subtitle {

            text-align: center;

            color: #666;

            margin-bottom: 25px;

            line-height: 1.5;
        }

        .email {

            font-weight: bold;

            color: #4f46e5;
        }

        label {

            display: block;

            margin-bottom: 8px;

            font-weight: bold;
        }

        input {

            width: 100%;

            padding: 13px;

            text-align: center;

            letter-spacing: 5px;

            font-size: 20px;

            border: 1px solid #ccc;

            border-radius: 7px;
        }

        input:focus {

            outline: none;

            border-color: #4f46e5;
        }

        button {

            width: 100%;

            padding: 12px;

            margin-top: 20px;

            border: none;

            border-radius: 7px;

            background: #4f46e5;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {

            background: #4338ca;
        }

        .back {

            text-align: center;

            margin-top: 20px;
        }

        .back a {

            color: #4f46e5;

            text-decoration: none;
        }

        .alert {

            padding: 10px;

            margin-bottom: 15px;

            border-radius: 6px;

            background: #f8d7da;

            color: #842029;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Verify OTP</h1>

    <p class="subtitle">

        We sent a 6-digit verification code to

        <br>

        <span class="email">
            {{ email }}
        </span>

    </p>

    {% with messages = get_flashed_messages(with_categories=true) %}

        {% if messages %}

            {% for category, message in messages %}

                <div class="alert">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}

    <form method="POST">

        <label for="otp">
            Verification Code
        </label>

        <input
            type="text"
            id="otp"
            name="otp"
            maxlength="6"
            minlength="6"
            pattern="[0-9]{6}"
            placeholder="••••••"
            required
        >

        <button type="submit">
            Verify OTP
        </button>

    </form>

    <div class="back">

        <a href="{{ url_for('auth.forgot_password') }}">
            ← Request a new code
        </a>

    </div>

</div>

</body>
</html>
